spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Hong_Kong
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    table: flyway_schema_history_auth
    baseline-on-migrate: true

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
